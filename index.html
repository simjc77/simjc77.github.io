<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e62832">
<title>포켓몬 카드 감정소</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f5f8;--card:#fff;--fg:#1d1f27;--mut:#6b7080;--line:#e2e4ea;--red:#e62832;--acc:#2f6fed;--ok:#14a05a;--warn:#e3a008;--S:#b8860b;--A:#7b3fe4;--B:#2f6fed;--C:#14a05a;--D:#8a8f9c}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--fg:#eceef3;--mut:#9aa0ae;--line:#2c303b}}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 auto 0 0;display:flex;align-items:center;gap:8px}
header h1 img{width:28px;height:28px}
header button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35)}
header button.hot{background:#ffd400;color:#222;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:19}
nav button{white-space:nowrap;background:none;border:1px solid transparent}
nav button.on{background:var(--red);color:#fff}
main{max-width:1200px;margin:0 auto;padding:12px 16px 80px}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;display:inline-block}
button.pri,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;position:relative}
.tile img{width:100%;aspect-ratio:245/342;object-fit:contain;border-radius:6px;background:#0001}
.tile .nm{font-size:13px;font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .pr{font-size:13px;color:var(--ok);font-weight:700}
.tile .own{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;border-radius:6px;font-size:11px;padding:1px 5px}
.tier{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;color:#fff;font-weight:900;font-size:24px}
.tier.S{background:var(--S)}.tier.A{background:var(--A)}.tier.B{background:var(--B)}.tier.C{background:var(--C)}.tier.D{background:var(--D)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;background:#0000000f;margin:2px 2px 2px 0}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:16px}
.detail img.big{width:100%;border-radius:12px}
@media (max-width:700px){th{white-space:nowrap;font-size:13px}.detail{grid-template-columns:1fr}.detail img.big{max-width:300px;margin:auto;display:block}nav{top:auto}header{position:static}}
.links a{margin:3px 4px 3px 0}
#drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--acc);background:#2f6fed11}
.thumbs img{height:110px;border-radius:8px;margin:4px;border:1px solid var(--line)}
dialog{border:none;border-radius:14px;padding:0;max-width:min(980px,96vw);width:96vw;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:#0008}
dialog .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
dialog .bd{padding:14px;max-height:80vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
.err{background:#e6283214;border:1px solid #e6283255;color:inherit;border-radius:10px;padding:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
h2{font-size:18px;margin:6px 0}h3{font-size:16px;margin:12px 0 6px}
</style>
</head>
<body>
<header>
  <h1><img src="icon-192.png" alt="">포켓몬 카드 감정소 <span class="mut" style="color:#fff9" id="ver"></span></h1>
  <button onclick="showPhone()" title="핸드폰에서 쓰기">📱 폰</button>
  <button id="bUpdate" title="수정된 앱 파일을 바로 적용">🔄 업데이트</button>
  <button id="bRestart" title="로컬 서버 재시작">♻️ 재시작</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg"><div class="hd"><b id="dlgT"></b><button onclick="dlg.close()">✕ 닫기</button></div><div class="bd" id="dlgB"></div></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
